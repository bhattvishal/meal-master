name: Send today's meals on WhatsApp

on:
  schedule:
    # 00:30 UTC is 6:00 am in India. GitHub can start scheduled runs a few minutes late.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to send (YYYY-MM-DD). Leave empty for today.'
        required: false
      dry_run:
        description: 'Only print the messages, do not send'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync meals from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DISHES_DB: ${{ vars.NOTION_DISHES_DB }}
          NOTION_SCHEDULE_DB: ${{ vars.NOTION_SCHEDULE_DB }}
          NOTION_COMBOS_DB: ${{ vars.NOTION_COMBOS_DB }}
          STOCK_PHOTOS: '0'
          PAST_DAYS: '1'
          FUTURE_DAYS: '2'
        run: node scripts/sync-notion.mjs

      - name: Send messages
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WHATSAPP_DB: ${{ vars.NOTION_WHATSAPP_DB }}
          # WhatsApp Business (Meta Cloud API). Without these, messages go through CallMeBot.
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_LANGUAGE_CODES: ${{ vars.WHATSAPP_LANGUAGE_CODES }}
          # "photo" (default, template meal_photo) or "text" (template meal_update).
          WHATSAPP_TEMPLATE_KIND: ${{ vars.WHATSAPP_TEMPLATE_KIND }}
          MEAL_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/send-whatsapp.mjs
