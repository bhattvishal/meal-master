name: Deploy site

# Publishes site/ to GitHub Pages. Meal data no longer passes through here: the app reads it
# live from the Cloudflare Worker in worker/, so this workflow needs no secrets.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A hash of the app's code, so installed apps reload only when the code changed.
      - name: Stamp build version
        run: |
          BUILD=$(find site -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
          sed -i "s/__BUILD__/${BUILD}/" site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
